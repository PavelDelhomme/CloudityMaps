# Hubera Portainer Git — unitaire.
# Stack: hubera-maps
# Compose: docker-compose.portainer.yml
# Réseau: ${NPM_NETWORK:-shared-network-copy}
# Ne jamais: docker compose down -v · Remove volumes · rename stacks users.

services:
  web:
    build:
      context: .
      args:
        MAPS_BUILD: "0.1.14"
    image: hubera-maps:local
    container_name: hubera-maps
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - hubera.slug=maps
      - hubera.update_channel=maps
    volumes:
      - hubera-maps-html:/var/cache/nginx
    networks:
      - proxy

volumes:
  hubera-maps-html:
    name: hubera-maps-html

networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-shared-network-copy}
