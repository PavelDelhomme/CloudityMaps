<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hubera Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Google Sans", "Segoe UI", system-ui, sans-serif; background: #e8eaed; color: #202124; }
    #map { position: absolute; inset: 0; }
    .search {
      position: absolute; z-index: 1000; left: 12px; right: 12px; top: 12px;
      max-width: 480px;
    }
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border-radius: 28px; padding: 0 16px; height: 48px;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .search-bar input {
      flex: 1; border: 0; outline: 0; font-size: 16px; background: transparent;
    }
    .hits {
      margin-top: 8px; background: #fff; border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.2); overflow: hidden;
    }
    .hit { display: block; width: 100%; text-align: left; padding: 12px 14px; border: 0; background: #fff; cursor: pointer; border-bottom: 1px solid #e8eaed; font-size: 15px; }
    .hit:hover { background: #f1f3f4; }
    .fab {
      position: absolute; z-index: 1000; right: 16px; bottom: 96px;
      width: 48px; height: 48px; border-radius: 24px; border: 0; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; font-size: 18px;
    }
    .sheet, .fuel, .tabs {
      position: absolute; z-index: 1000; left: 0; right: 0; bottom: 0;
      background: #fff; box-shadow: 0 -2px 8px rgba(0,0,0,.12);
    }
    .sheet { left: 12px; right: 12px; bottom: 72px; border-radius: 16px; padding: 14px; width: auto; }
    .sheet strong { display: block; }
    .sheet span { color: #5f6368; font-size: 13px; }
    .fuel { padding: 12px 16px 16px; border-radius: 16px 16px 0 0; z-index: 1001; }
    .fuel .title { color: #188038; font-weight: 700; margin-bottom: 10px; }
    .fuel .row { display: flex; gap: 8px; }
    .fuel button { flex: 1; border: 0; border-radius: 999px; padding: 10px; font-weight: 700; cursor: pointer; }
    .pause { background: #e8f0fe; color: #1a73e8; }
    .stop { background: #fce8e6; color: #c5221f; }
    .fill { background: #e6f4ea; color: #137333; }
    .hits[hidden], .sheet[hidden], .fuel[hidden], .tabs[hidden] { display: none !important; }
    .tabs .on { color: #1a73e8; font-weight: 700; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="search">
    <form class="search-bar" id="searchForm">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="Rechercher ici" autocomplete="off" />
    </form>
    <div class="hits" id="hits" hidden></div>
  </div>
  <button type="button" class="fab" id="btnHere" title="Ma position">◎</button>
  <div class="sheet" id="sheet" hidden></div>
  <div class="fuel" id="fuel" hidden>
    <div class="title" id="fuelTitle">Suivi Fuel</div>
    <div class="row">
      <button type="button" class="pause" id="btnPause">Pause</button>
      <button type="button" class="stop" id="btnStop">Arrêter</button>
      <button type="button" class="fill" id="btnFill">Plein</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <span class="on">Explorer</span>
    <span>Trajets Fuel</span>
    <span>Enregistrés</span>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
