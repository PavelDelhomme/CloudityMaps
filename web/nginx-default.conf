server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location = /auth {
        return 302 https://maps.hubera.cloud/;
    }
    location = /auth/ {
        return 302 https://maps.hubera.cloud/;
    }

    location = /app/ {
        return 302 /;
    }
    location = /app {
        return 302 /;
    }

    location = /install {
        try_files /install.html =404;
    }
    location = /install/ {
        try_files /install.html =404;
    }
    location = /updates.json {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        try_files /updates.json =404;
    }

    # Proxy Overpass : les téléphones n’atteignent pas toujours overpass-api.de.
    # CORS * pour le JS file:// ; le natif HuberaSpeed tape aussi ici.
    location = /overpass {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
        proxy_pass https://overpass-api.de/api/interpreter;
        proxy_ssl_server_name on;
        proxy_ssl_name overpass-api.de;
        proxy_set_header Host overpass-api.de;
        proxy_set_header User-Agent "HuberaMaps/0.1.48 (https://maps.hubera.cloud)";
        proxy_connect_timeout 8s;
        proxy_send_timeout 12s;
        proxy_read_timeout 12s;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        client_max_body_size 128k;
    }
    location /apk/ {
        gzip off;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
